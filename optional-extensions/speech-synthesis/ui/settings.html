<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="settings.js"></script>
</head>
<body>
  <p class="lead">每项语音能力各用一个服务。点“添加”或“编辑”展开该项，改完后点窗口下方的“保存插件设置”生效。</p>
  <p class="notice" id="run-note" hidden>请先勾选页面上方的“允许此插件运行”，才能试听和测试。测试不会启用插件，保存后才生效。</p>

  <section class="panel models" aria-label="语音能力">
    <div id="capability-list"></div>
    <div class="recognition-line">
      <label for="recognition">收到语音时使用</label>
      <select id="recognition">
        <option value="realtime">实时语音识别</option>
        <option value="file">单条语音识别</option>
        <option value="off">不识别</option>
      </select>
      <small id="recognition-note"></small>
    </div>
    <p class="hint" id="migration-note" hidden></p>
  </section>

  <details class="panel optional" id="authorization">
    <summary>聊天授权</summary>
    <div class="fields">
      <p id="authorization-status"></p>
      <ul class="chats" id="authorization-chats"></ul>
      <p class="hint" id="authorization-guide"></p>
    </div>
  </details>

  <details class="panel optional" id="advanced">
    <summary>高级设置</summary>
    <div class="fields">
      <div class="field">
        <label for="reply-mode">回复的生成方式</label>
        <select id="reply-mode">
          <option value="dsh">由 DSH 生成回复（推荐）</option>
          <option value="direct">由 Realtime 模型直接对话（不经过 DSH）</option>
        </select>
        <small id="reply-hint"></small>
      </div>
      <div class="field">
        <label for="instructions">语气指令（可留空）</label>
        <textarea id="instructions" rows="2" placeholder="例如：用轻松温柔的语气说话"></textarea>
        <small>设定合成语音的语气或风格。只有支持语气指令的服务会使用；不支持的服务可能报错。</small>
      </div>
      <div class="field">
        <label for="timeout-seconds">等待服务响应的最长时间（秒）</label>
        <input id="timeout-seconds" type="number" min="1" max="25" step="1">
        <div class="advice" data-advice="timeoutMs" hidden></div>
      </div>
    </div>
  </details>
  <p class="error" id="error" role="alert"></p>

  <!-- Moved into the speech synthesis editor while it is open. -->
  <div id="clone-holder" hidden>
    <details id="voice-clone" class="optional" hidden>
      <summary>声音复刻：用自己的录音创建音色</summary>
      <div class="fields">
        <p class="hint" id="clone-hint"></p>
        <div class="field">
          <label for="clone-audio">参考录音</label>
          <input id="clone-audio" type="file" accept=".wav,.mp3,.m4a">
        </div>
        <div class="field">
          <label for="clone-prefix">音色名称前缀</label>
          <input id="clone-prefix" type="text" maxlength="10" value="myvoice" spellcheck="false">
          <small>1–10 个英文字母或数字。</small>
        </div>
        <div class="actions"><button id="clone-create" type="button">上传录音并创建音色</button></div>
        <div class="field">
          <label for="clone-id">复刻音色 ID</label>
          <input id="clone-id" type="text" maxlength="200" spellcheck="false" placeholder="创建后自动填入，也可粘贴已有 ID">
        </div>
        <div class="actions">
          <button id="clone-query" type="button">查询审核状态</button>
          <button id="clone-use" type="button" disabled>使用此音色</button>
        </div>
        <p id="clone-status" class="hint" role="status"></p>
      </div>
    </details>
  </div>
</body>
</html>
